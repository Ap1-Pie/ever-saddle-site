<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ever saddle</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=29">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="logo">Ever saddle</div>
      <div class="head-actions">
        <!-- Итерация 22: заявки - приём седла и выездная примерка -->
        <button type="button" class="fav-toggle" id="requestBtn" aria-label="Заявки" title="Заявки">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        </button>
        <!-- Итерация 4: избранное (CloudStorage в Телеграме, localStorage в браузере) -->
        <button type="button" class="fav-toggle" id="favToggle" aria-label="Избранное" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="fav-badge" id="favBadge" hidden>0</span>
        </button>
        <!-- Сердце открытого седла занимает место глобального в шапке (итерация 15) -->
        <button type="button" class="fav-toggle" id="favCardBtn" hidden aria-label="Добавить в избранное" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
    </header>
    <!-- Возврат в каталог из раздела избранного (итерация 16) -->
    <div id="favBack" hidden>
      <button type="button" class="back-btn" id="favBackBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Каталог
      </button>
    </div>
    <div class="toolbar">
      <!-- Итерация 3: шторка фильтров -->
      <button type="button" class="pill" id="filterBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        Фильтры
        <span class="pill-badge" id="filterBadge" hidden>0</span>
      </button>
      <div class="count" id="count"></div>
      <!-- Итерация 10: сортировка каталога, проданные всегда внизу -->
      <button type="button" class="pill" id="sortBtn" aria-label="Сортировка каталога">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        <span id="sortLabel">Новые</span>
      </button>
    </div>
    <main class="grid" id="grid"></main>

    <!-- Шторка фильтров -->
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <section class="sheet" id="filterSheet" aria-label="Фильтры каталога">
      <h2 class="sheet-title">Фильтры</h2>
      <div id="filterGroups"></div>
      <div class="sheet-actions">
        <button type="button" class="show-btn" id="applyBtn">Показать</button>
        <button type="button" class="reset-btn" id="resetBtn">Сбросить</button>
      </div>
    </section>
    <!-- Мини-шторка сортировки -->
    <section class="sheet" id="sortSheet" aria-label="Сортировка каталога">
      <h2 class="sheet-title">Сортировка</h2>
      <div id="sortOptions"></div>
    </section>
    <!-- Мини-шторка заявок (итерация 22): примерка чаще, поэтому первой -->
    <section class="sheet" id="requestSheet" aria-label="Заявки">
      <h2 class="sheet-title">Заявки</h2>
      <div id="requestOptions">
        <button type="button" class="req-row" data-request="fitting">
          <span class="req-row-main">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Заказать выездную примерку
          </span>
          <span class="req-row-sub">Москва и МО - сёдла привезут на примерку</span>
        </button>
        <button type="button" class="req-row" data-request="sell">
          <span class="req-row-main">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            Сдать седло на реализацию
          </span>
          <span class="req-row-sub">Ваше седло выставят в каталог</span>
        </button>
      </div>
    </section>
    <!-- Полноэкранный просмотр фото -->
    <div class="photo-viewer" id="photoViewer" aria-label="Просмотр фото"></div>
    <!-- Форма заявки (итерация 22) -->
    <div class="request-view" id="requestView" aria-label="Форма заявки"></div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>window.ASSETS_V = '?v=29';</script>
  <script src="app.js?v=29"></script>
</body>
</html>
